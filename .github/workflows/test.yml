name: Test

on:
  push:
  pull_request:

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.7.0 -Force -Scope CurrentUser
      - name: Run tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path Tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
